<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghazi Raza | Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* CSS resets and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #0f172a; /* Deep modern tech blue/black */
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Main card container */
        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            padding: 50px 40px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        h2 {
            font-size: 1.1rem;
            color: #38bdf8; /* Bright tech blue accent */
            margin-bottom: 24px;
            font-weight: 500;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 32px;
            font-size: 1.05rem;
        }

        /* Animated status pill */
        .status {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 32px;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

        .pulse {
            width: 8px;
            height: 8px;
            background: #38bdf8;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        /* Call to action buttons */
        .links {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .links a {
            text-decoration: none;
            color: #f8fafc;
            background: #334155;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .links a:hover {
            background: #475569;
            transform: translateY(-2px);
        }

        .links a.primary {
            background: #0284c7;
            color: white;
        }

        .links a.primary:hover {
            background: #0369a1;
        }

        /* Mobile responsiveness */
        @media (max-width: 480px) {
            h1 { font-size: 2rem; }
            .container { padding: 40px 20px; }
            .links { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status">
            <div class="pulse"></div>
            Infrastructure in progress
        </div>

        <h1>Ghazi Raza</h1>
        <h2>Network Engineering Student &amp; CCNA Candidate</h2>
        
        <p>I am currently configuring the backend routing and building out my interactive digital resume. My full portfolio site will be launching here soon.</p>

        <div class="links">
            <a href="https://linkedin.com/in/yourprofile" target="_blank">LinkedIn</a>
            <a href="https://github.com/yourusername" target="_blank">GitHub</a>
            <a href="mailto:me@ghaziraza.com" class="primary">Contact Me</a>
        </div>
    </div>
</body>
</html>
